name: UI browser checks
on:
  pull_request:
    paths: ['site/**', 'tests/ui_smoke.py', 'tests/ui_navigation.py', '.github/workflows/ui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  responsive-player:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install browser test dependencies
        run: |
          python -m pip install --disable-pip-version-check playwright==1.65.0
          python -m playwright install --with-deps chromium webkit
      - name: Check real layouts and interactions with fixture games
        env:
          DEBUG: pw:browser
        run: python tests/ui_smoke.py
      - name: Isolate WebKit navigation after a failed browser check
        if: failure()
        env:
          DEBUG: pw:browser
        run: python tests/ui_navigation.py
      - name: Save UI screenshots and test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ui-browser-evidence
          path: ui-artifacts/
          retention-days: 7
